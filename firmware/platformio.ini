; Tap32 – firmware macropada 3×3 + enkoder + OLED
; Środowiska: kb2040 (domyślne), xiao_esp32s3, native (testy jednostkowe na PC)

[platformio]
default_envs = kb2040

[common]
fw_version = 1.0.0
lib_deps =
    olikraus/U8g2@^2.36.18
    bblanchon/ArduinoJson@^7.4.3
build_flags =
    -DTAP32_FW_VERSION=\"${common.fw_version}\"
build_src_flags =
    -Wall
    -Wextra
; chain+ uwzględnia #if – HAL drugiej płytki nie wciąga jej bibliotek
lib_ldf_mode = chain+

; ---------------------------------------------------------------------------
; Adafruit KB2040 (RP2040), rdzeń arduino-pico (Earle Philhower) + Adafruit TinyUSB
; ---------------------------------------------------------------------------
[env:kb2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_kb2040
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
; Nazwa USB „Tap32” (VID/PID zostają domyślne płytki)
board_build.arduino.earlephilhower.usb_manufacturer = Tap32
board_build.arduino.earlephilhower.usb_product = Tap32
build_flags =
    ${common.build_flags}
    -DUSE_TINYUSB
    -DTAP32_BOARD_KB2040
build_src_flags = ${common.build_src_flags}
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit NeoPixel@^1.15.5
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Seeed Studio XIAO ESP32-S3, Arduino-ESP32 3.x (pioarduino), USB OTG (TinyUSB): CDC + HID
; ---------------------------------------------------------------------------
[env:xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
; Nadpisujemy extra_flags z definicji płytki (domyślnie ARDUINO_USB_MODE=1 = HW CDC/JTAG bez HID)
board_build.extra_flags =
    -DARDUINO_XIAO_ESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    ${common.build_flags}
    -DTAP32_BOARD_XIAO_ESP32S3
    -DUSB_PRODUCT=\"Tap32\"
    -DUSB_MANUFACTURER=\"Tap32\"
    -DCORE_DEBUG_LEVEL=0
build_src_flags = ${common.build_src_flags}
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps = ${common.lib_deps}
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Testy jednostkowe na PC: parser protokołu, dekoder enkodera, debounce, kody HID, konfiguracja
; Wymaga gcc/g++ w PATH (Windows: MinGW-w64 / MSYS2, Linux/macOS: systemowy).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@^7.4.3
build_flags =
    -std=gnu++14
    -DTAP32_NATIVE
    -Wall
